<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host preview</title>
<style>
  :root { --bg: #1d1418; --ink: #f3e9ee; --muted: #a8939d; --line: #3a2b32; --panel: #281c22; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header b { font-size: 1rem; }
  label { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  input { width: 64px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
  button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; font: inherit; cursor: pointer; }
  main { flex: 1; min-height: 0; display: flex; gap: 24px; align-items: flex-start; justify-content: center; padding: 16px; }
  .dev { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .dev .name { color: var(--muted); font-weight: 600; }
  .box { overflow: hidden; border: 1px solid var(--line); border-radius: 12px; }
  iframe { border: 0; transform-origin: 0 0; display: block; background: #fff; }
</style>
</head>
<body>
<header>
  <b>Host preview</b>
  <label>Closed (portrait) <input id="aw" type="number"> x <input id="ah" type="number"></label>
  <label>Open (landscape) <input id="bw" type="number"> x <input id="bh" type="number"></label>
  <button id="reload">Reload both</button>
  <button id="reset">Fold 8 sizes</button>
  <label title="The closed screen runs the game and the open screen copies it. Taps on either one happen on both."><input id="sync" type="checkbox" style="width:auto"> Sync both screens</label>
</header>
<main id="main">
  <div class="dev"><div class="name" id="an"></div><div class="box" id="abox"><iframe id="a"></iframe></div></div>
  <div class="dev"><div class="name" id="bn"></div><div class="box" id="bbox"><iframe id="b"></iframe></div></div>
</main>
<script>
// Screen sizes in CSS pixels (what the game sees). Edit them in the header; they're remembered.
// Galaxy Fold 8, from the panel specs at Samsung's default display size (about 158 CSS px per inch):
//   cover 1248 x 1972 px at 428 ppi -> 461 x 728, inner 2448 x 1848 px at 403 ppi -> 960 x 725
const DEF = { aw: 461, ah: 728, bw: 960, bh: 725 };
const KEY = "host-preview-sizes-v2";
let S = DEF;
try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const $ = id => document.getElementById(id);
for (const k in DEF) { $(k).value = S[k]; $(k).onchange = () => { S[k] = +$(k).value || DEF[k]; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} layout(); }; }
const src = "../www/index.html";
$("a").src = src; $("b").src = src;
$("reload").onclick = () => { $("a").src = src; $("b").src = src; };
$("reset").onclick = () => { S = Object.assign({}, DEF); for (const k in DEF) $(k).value = S[k]; try { localStorage.removeItem(KEY); } catch (e) {} layout(); };
// both frames are scaled down by the same amount so they keep their true proportions to each other
function layout() {
  const availH = $("main").clientHeight - 60, availW = $("main").clientWidth - 24 - 32;
  const k = Math.min(1, availH / Math.max(S.ah, S.bh), availW / (S.aw + S.bw));
  for (const [f, w, h, n, label] of [["a", S.aw, S.ah, "an", "Fold closed"], ["b", S.bw, S.bh, "bn", "Fold open"]]) {
    $(f).style.width = w + "px"; $(f).style.height = h + "px"; $(f).style.transform = "scale(" + k + ")";
    $(f + "box").style.width = w * k + "px"; $(f + "box").style.height = h * k + "px";
    $(n).textContent = label + ", " + w + " x " + h + (k < 1 ? " (shown at " + Math.round(k * 100) + "%)" : "");
  }
}
addEventListener("resize", layout); layout();

// Sync: the closed screen leads (runs the game), the open screen follows (draws the leader's state).
// The game only listens for this inside the preview; see "preview mirror" in www/index.html.
let sync = true;
try { sync = localStorage.getItem("host-preview-sync") !== "0"; } catch (e) {}
$("sync").checked = sync;
const roles = () => [["a", sync ? "lead" : null], ["b", sync ? "follow" : null]];
function sendRoles() { for (const [f, role] of roles()) $(f).contentWindow.postMessage({ hostMirror: 1, role }, "*"); }
$("a").addEventListener("load", sendRoles); $("b").addEventListener("load", sendRoles);
$("sync").onchange = () => { sync = $("sync").checked; try { localStorage.setItem("host-preview-sync", sync ? "1" : "0"); } catch (e) {} sendRoles(); };
// pass messages from one copy to the other
addEventListener("message", e => {
  if (!sync || !e.data || !e.data.hostMirror) return;
  const to = e.source === $("a").contentWindow ? $("b") : e.source === $("b").contentWindow ? $("a") : null;
  if (to) to.contentWindow.postMessage(e.data, "*");
});
</script>
</body>
</html>
